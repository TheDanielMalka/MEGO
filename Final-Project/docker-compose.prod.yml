version: "3.9"

# Production compose – uses pre-built image from Docker Hub.
# On EC2: docker compose -f docker-compose.prod.yml up -d

networks:
  mego-net:
    driver: bridge

volumes:
  postgres-data:

services:

  db:
    image: postgres:16-alpine
    container_name: mego-db
    restart: always
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-mego}
      POSTGRES_USER:     ${POSTGRES_USER:-mego}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - mego-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mego}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: DOCKER_USERNAME/mego-hr:latest   # CI/CD replaces this tag
    container_name: mego-app
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mego}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mego}
      SECRET_KEY:   ${SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mego-net
    expose:
      - "5000"

  nginx:
    image: nginx:1.25-alpine
    container_name: mego-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - mego-net
