version: "3.9"

networks:
  mego-net:
    driver: bridge

volumes:
  postgres-data:

services:

  # ── PostgreSQL Database ────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: mego-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-mego}
      POSTGRES_USER:     ${POSTGRES_USER:-mego}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mego}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - mego-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mego}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Flask Application ──────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mego-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mego}:${POSTGRES_PASSWORD:-mego}@db:5432/${POSTGRES_DB:-mego}
      SECRET_KEY:   ${SECRET_KEY:-change-me-in-production}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mego-net
    expose:
      - "5000"

  # ── Nginx Reverse Proxy ────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: mego-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/app/static:ro
    depends_on:
      - app
    networks:
      - mego-net
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
