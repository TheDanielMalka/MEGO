{% extends "base.html" %}
{% block title %}Not Found{% endblock %}
{% block page_title %}Page Not Found{% endblock %}

{% block content %}
<div class="card" style="text-align:center;padding:80px 32px">
  <div style="font-size:80px;margin-bottom:16px">🔍</div>
  <h2 style="font-size:32px;font-weight:700;margin-bottom:8px">404 – Not Found</h2>
  <p style="color:var(--text-muted);margin-bottom:32px">The page or resource you're looking for doesn't exist.</p>
  <a href="{{ url_for('index') }}" class="btn btn-primary">← Go to Dashboard</a>
</div>
{% endblock %}
