<!DOCTYPE html>
<html lang="he" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Dashboard{% endblock %} | MEGO HR</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-logo">
    <h1>MEGO HR</h1>
    <span>Employee Dashboard</span>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-section">Main</div>
    <a href="{{ url_for('index') }}"
       class="{% if request.endpoint == 'index' %}active{% endif %}">
      <span class="icon">🏠</span> Dashboard
    </a>

    <div class="nav-section" style="margin-top:12px">Employees</div>
    <a href="{{ url_for('employees.employees_list') }}"
       class="{% if request.endpoint and 'employee' in request.endpoint %}active{% endif %}">
      <span class="icon">👤</span> All Employees
    </a>
    <a href="{{ url_for('employees.employee_add') }}">
      <span class="icon">➕</span> Add Employee
    </a>

    <div class="nav-section" style="margin-top:12px">Offices</div>
    <a href="{{ url_for('offices.offices_list') }}"
       class="{% if request.endpoint and 'office' in request.endpoint %}active{% endif %}">
      <span class="icon">🏢</span> All Offices
    </a>
    <a href="{{ url_for('offices.office_add') }}">
      <span class="icon">➕</span> Add Office
    </a>
  </nav>
</aside>

<div class="main">
  <header class="topbar">
    <div>
      <div class="breadcrumb">
        <a href="{{ url_for('index') }}">Home</a>
        {% block breadcrumb %}{% endblock %}
      </div>
      <h2>{% block page_title %}Dashboard{% endblock %}</h2>
    </div>
    {% block topbar_actions %}{% endblock %}
  </header>

  <main class="content">
    {% block content %}{% endblock %}
  </main>
</div>

</body>
</html>
